<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Screenshot Inbox</title><link rel="stylesheet" href="/ui/style.css"></head>
<body>
  <header><div><span class="eyebrow">LOCAL LIBRARY</span><h1>Screenshot Inbox</h1></div><button id="choose">Choose image folder</button></header>
  <main>
    <div class="library"><span id="folder">No folder selected</span><button id="rescan" disabled>Rescan folder</button></div>
    <form id="search"><label for="query" class="sr-only">Search images</label><input id="query" type="search" maxlength="2000" placeholder="A dog on the beach, or text from an invoice…" autocomplete="off"><label for="mode" class="sr-only">Search mode</label><select id="mode"><option value="hybrid">Visual + text</option><option value="visual">Visual only</option><option value="text">OCR text only</option></select><button id="submit" disabled>Search</button></form>
    <p id="status" role="status" aria-live="polite">Choose an existing folder to build your local index.</p>
    <section id="results" aria-label="Image search results"></section>
    <p id="empty">Find what an image shows—not just what it says.</p>
  </main>
  <footer>Images stay on this device. First use downloads model weights and English OCR data. No cloud inference.</footer>
  <script type="module" src="/ui/main.js"></script>
</body></html>
