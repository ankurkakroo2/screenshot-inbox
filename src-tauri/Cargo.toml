[package]
name = "screenshot-inbox"
version = "0.1.0"
description = "Local visual and OCR image search"
authors = ["Ankur Kakroo"]
license = "MIT"
repository = "https://github.com/ankurkakroo2/screenshot-inbox"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.4" }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
